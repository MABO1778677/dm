name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ========== 新增：注入数据库配置 ==========
      - name: Inject database config
        run: |
          python3 -c "
          with open('data_handle.js', 'r') as f:
              content = f.read()
          content = content.replace('__DB_NAME__',  '${{ vars.DB_NAME }}')
          content = content.replace('__DB_USER__',  '${{ vars.DB_USER }}')
          content = content.replace('__PASSWD__',   '${{ secrets.PASSWD }}')
          with open('data_handle.js', 'w') as f:
              f.write(content)
          "
      # ==========================================

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
